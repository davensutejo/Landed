<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>到岸 Landed · 商品体检</title>
  <meta name="description" content="上传商品表，一次看出哪些商品在亏钱，以及每件该怎么改。" />
  <meta name="theme-color" content="#FAF6EC" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2314110F'/%3E%3Cpath d='M22 18 V44 H44' fill='none' stroke='%23F3EDE0' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #FAF6EC; --panel: #F3EDE0; --line: #E2D8C3; --ink: #14110F; --muted: #6B6156;
      --bad: #C2410C; --bad-bg: #FBE4D8; --warn: #9A6B00; --warn-bg: #F6EBCB; --ok: #2E7D32; --ok-bg: #E3F0DF;
      --accent: #2B3A8C;
      --sans: "Instrument Sans", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, "PingFang SC", monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14110F; --panel: #1E1A16; --line: #3A332B; --ink: #F3EDE0; --muted: #A89C8C;
        --bad: #FF8A5C; --bad-bg: #3A1E12; --warn: #E8C065; --warn-bg: #352A0E; --ok: #7FCB86; --ok-bg: #16291A; --accent: #A9B9DE; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); }
    main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 64px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    header a { color: inherit; text-decoration: none; font-weight: 600; }
    h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); margin: 0 0 4px; font-weight: 600; letter-spacing: -0.01em; }
    .lede { color: var(--muted); margin: 0 0 20px; max-width: 60ch; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
    textarea { width: 100%; min-height: 150px; font: 13px/1.5 var(--mono); color: var(--ink); background: var(--bg);
      border: 1px solid var(--line); border-radius: 10px; padding: 10px; resize: vertical; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
    label.f { display: flex; gap: 6px; align-items: center; font-size: 14px; color: var(--muted); }
    select, input[type=number] { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
      border-radius: 8px; padding: 6px 8px; }
    input[type=number] { width: 80px; }
    button { font: inherit; border-radius: 999px; padding: 8px 16px; border: 1px solid var(--line); background: var(--bg);
      color: var(--ink); cursor: pointer; }
    button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
    button:disabled { opacity: .5; cursor: wait; }
    .hint { font-size: 13px; color: var(--muted); }
    .err { color: var(--bad); margin-top: 10px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 24px 0 12px; }
    .card { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--panel); }
    .card b { display: block; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
    .card span { font-size: 13px; color: var(--muted); }
    .card.bad b { color: var(--bad); } .card.warn b { color: var(--warn); } .card.ok b { color: var(--ok); }
    .headline { font-size: 1.1rem; margin: 8px 0 16px; }
    .tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 760px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; background: var(--panel); }
    td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .v-loses_money { background: var(--bad-bg); color: var(--bad); }
    .v-below_target { background: var(--warn-bg); color: var(--warn); }
    .v-on_target { background: var(--ok-bg); color: var(--ok); }
    .v-not_priced, .v-error, .v-no_price { background: var(--line); color: var(--ink); }
    ul.acts { margin: 0; padding-left: 18px; } ul.acts li { margin: 2px 0; }
    .muted { color: var(--muted); font-size: 13px; }
    footer { margin-top: 24px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
<main>
  <header>
    <a href="/agent">到岸 <span style="font-weight:400">Landed</span></a>
    <button type="button" id="lang"></button>
  </header>
  <h1 data-t="title"></h1>
  <p class="lede" data-t="lede"></p>

  <section class="panel">
    <textarea id="csv" spellcheck="false" aria-label="CSV"></textarea>
    <div class="row">
      <input type="file" id="file" accept=".csv,.tsv,.txt,text/csv" hidden />
      <button type="button" id="upload" data-t="upload"></button>
      <button type="button" id="sample" data-t="sample"></button>
      <label class="f"><span data-t="market"></span> <select id="market"></select></label>
      <label class="f"><span data-t="margin"></span> <input type="number" id="margin" min="1" max="70" step="1" value="25" />%</label>
      <button type="button" class="primary" id="run" data-t="run"></button>
    </div>
    <p class="hint" data-t="hint"></p>
    <div class="err" id="err" role="alert"></div>
  </section>

  <section id="out" hidden>
    <div class="cards" id="cards"></div>
    <p class="headline" id="headline"></p>
    <div class="tbl"><table>
      <thead><tr><th data-t="product"></th><th data-t="verdict"></th><th data-t="now"></th><th data-t="profit"></th><th data-t="fix"></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <p class="muted" id="cols"></p>
  </section>
  <footer data-t="foot"></footer>
</main>
<script type="module">
const T = {
  zh: {
    title: '商品体检', lede: '粘贴或上传商品表，一次看出哪些商品在 €3 小包关税下亏钱、哪些低于目标毛利，以及每件该怎么改。所有数字都来自同一个确定性引擎，不经过语言模型。',
    upload: '上传 CSV', sample: '示例表格', market: '默认市场', margin: '目标毛利', run: '开始体检',
    hint: '需要的列：成本（人民币）、重量（kg 或 g）。可选：商品名称、售价（欧元/美元）、市场、目标毛利、品类数、月销量。中英文表头都可以。',
    product: '商品', verdict: '结论', now: '现价 / 毛利', profit: '每件利润', fix: '建议',
    v: { loses_money: '在亏钱', below_target: '低于目标', on_target: '达标', no_price: '未填售价', not_priced: '无法定价', error: '数据有误' },
    cards: { products: '件商品', loses_money: '在亏钱', below_target: '低于目标', on_target: '达标', other: '需处理' },
    head: (n, t, m) => n ? `${t} 件商品里有 ${n} 件在亏钱${m ? `，按月销量计每月亏 ${m}` : ''}。先看表格最上面几行。` : `${t} 件商品里没有亏钱的。`,
    and: ' 和 ',
    a: {
      raise_price: a => `售价提到 ${a.m(a.to)} 达到目标毛利`,
      cut_cost: a => `或把进价谈到 ${a.y(a.to_cny)} 以内`,
      multipack: a => `改成 ${a.units} 件装 ${a.m(a.pack_price)}（每件便宜 ${a.m(a.saving_per_unit)}，€3 关税只付一次）`,
      one_set: a => `若能按一套商品申报（GRI 3(b)），目标价降到 ${a.m(a.price_if_one_set)}，需报关行确认`,
      better_market: a => `同价卖到${a.mname}每件多赚 ${a.m(a.gain_per_unit)}`,
    },
    net: '网络连接失败，请稍后再试。', http: s => `服务器出错（${s}），请稍后再试。`,
    f: { cogs_cny: '成本', weight_kg: '重量', weight_g: '重量', list_price: '售价', target_margin: '目标毛利', monthly_units: '月销量', item_categories: '品类数' },
    e: {
      empty: p => `${p.f}为空`,
      not_a_number: p => `${p.f}「${p.raw}」不是数字`,
      weight_unit: p => `重量「${p.raw}」没有单位：克请写 ${p.raw}g，公斤请写 ${p.raw}kg`,
      units_whole: p => `月销量「${p.raw}」必须是整数`,
      units_max: p => `月销量最多 ${p.max.toLocaleString()}`,
      market: p => `暂不支持市场「${p.raw}」：目前覆盖欧盟 27 国和美国`,
      no_cost: () => '缺少成本（人民币）',
      no_weight: () => '缺少重量',
      categories: () => '品类数必须是 1 到 20 的整数',
      price_currencies: p => `售价「${p.raw}」同时写了几种货币`,
      price_currency: p => `售价「${p.raw}」是${p.got === 'USD' ? '美元' : p.got === 'CNY' ? '人民币' : '欧元'}，卖到${p.mname}应填${p.want === 'USD' ? '美元' : '欧元'}`,
      ragged: p => `这一行有 ${p.cells} 格，表头只有 ${p.width} 列：商品名里有逗号时请加英文双引号`,
    },
    n: {
      above_ceiling: p => `约 €${p.price}，超过 €150 小包上限：超过后按具体税号的常规关税计算，本工具不定价，请咨询报关行`,
      missing_rate: () => '缺少已核实的税率，本工具不估算',
    },
    target: '目标价', lb: '美国价为下限：部分关税未加载', cols: '已识别的列：', ignored: '已忽略：',
    foot: '决策支持，不是持牌报关行。欧盟价格仅适用于 €150 以下小包（每税则类别 €3 平征关税）。',
    working: '体检中…', none: '—',
  },
  en: {
    title: 'Catalogue audit', lede: 'Paste or upload your product list and see, in one pass, which products lose money under the €3 parcel duty, which miss your target margin, and the fix for each. Every figure comes from the same deterministic engine, not the language model.',
    upload: 'Upload CSV', sample: 'Sample sheet', market: 'Default market', margin: 'Target margin', run: 'Run audit',
    hint: 'Required columns: cost (CNY) and weight (kg or g). Optional: name, price (EUR/USD), market, margin, item categories, monthly units. English or Chinese headers.',
    product: 'Product', verdict: 'Verdict', now: 'Price / margin', profit: 'Profit per unit', fix: 'Fix',
    v: { loses_money: 'Loses money', below_target: 'Below target', on_target: 'On target', no_price: 'No price given', not_priced: 'Cannot price', error: 'Bad row' },
    cards: { products: 'products', loses_money: 'lose money', below_target: 'below target', on_target: 'on target', other: 'need attention' },
    head: (n, t, m) => n ? `${n} of ${t} products lose money${m ? `: ${m} lost a month at your stated volumes` : ''}. Start at the top of the table.` : `None of your ${t} products lose money.`,
    and: ' and ',
    a: {
      raise_price: a => `Raise the price to ${a.m(a.to)} to hit your margin`,
      cut_cost: a => `or get the unit cost down to ${a.y(a.to_cny)}`,
      multipack: a => `Sell a ${a.units}-pack at ${a.m(a.pack_price)} (${a.m(a.saving_per_unit)} less per unit; the €3 duty is paid once)`,
      one_set: a => `If it can be declared as one set (GRI 3(b)), the target price drops to ${a.m(a.price_if_one_set)}; confirm with a broker`,
      better_market: a => `At the same price, ${a.mname} earns ${a.m(a.gain_per_unit)} more per unit`,
    },
    net: 'Could not reach the server. Please try again.', http: s => `The server had a problem (${s}). Please try again.`,
    f: { cogs_cny: 'Cost', weight_kg: 'Weight', weight_g: 'Weight', list_price: 'Price', target_margin: 'Target margin', monthly_units: 'Monthly units', item_categories: 'Item categories' },
    e: {
      empty: p => `${p.f} is empty`,
      not_a_number: p => `${p.f} "${p.raw}" is not a number`,
      weight_unit: p => `Weight "${p.raw}" has no unit: write ${p.raw}g for grams or ${p.raw}kg for kilograms`,
      units_whole: p => `Monthly units "${p.raw}" must be a whole number`,
      units_max: p => `Monthly units can be at most ${p.max.toLocaleString()}`,
      market: p => `Market "${p.raw}" is not covered yet: Landed prices the 27 EU countries and the US`,
      no_cost: () => 'No unit cost (CNY)',
      no_weight: () => 'No weight',
      categories: () => 'Item categories must be a whole number from 1 to 20',
      price_currencies: p => `Price "${p.raw}" names more than one currency`,
      price_currency: p => `Price "${p.raw}" is in ${p.got}; for ${p.mname} enter it in ${p.want}`,
      ragged: p => `This row has ${p.cells} cells but the header has ${p.width}: put a name that contains a comma in double quotes`,
    },
    n: {
      above_ceiling: p => `About €${p.price}, above the €150 parcel ceiling. Above it the exact code's duty applies, which Landed does not price; ask a customs broker`,
      missing_rate: () => 'A verified rate is missing, so Landed does not estimate this one',
    },
    target: 'target', lb: 'US price is a floor: part of the duty is not loaded', cols: 'Columns read: ', ignored: 'Ignored: ',
    foot: 'Decision support, not a licensed customs broker. EU prices cover parcels below €150 only (flat €3 duty per tariff category).',
    working: 'Auditing…', none: '—',
  },
};
const SAMPLE = `商品名称,成本,重量,售价,市场,月销量
棉袜5双装,12,250g,8.99,DE,300
便携榨汁杯,38,0.6,29.99,DE,120
手机壳,6,0.08,4.99,FR,500
硅胶冰格,9,0.15,6.49,DE,200
台灯,45,1.2,19.99,PL,80
蓝牙耳机,30,0.1,,DE,
电动滑板车,900,14,399,DE,5`;
const MARKETS = ['DE','AT','BE','BG','HR','CY','CZ','DK','EE','FI','FR','GR','HU','IE','IT','LV','LT','LU','MT','NL','PL','PT','RO','SK','SI','ES','SE','US'];

let lang = 'zh';
try { const q = new URLSearchParams(location.search).get('lang'); lang = q || localStorage.getItem('landed-lang') || (navigator.language.startsWith('zh') ? 'zh' : 'en'); } catch { /* storage blocked */ }
if (!T[lang]) lang = 'zh';
let last = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mname = code => { try { return new Intl.DisplayNames([lang === 'zh' ? 'zh-CN' : 'en'], { type: 'region' }).of(code === 'GR' ? 'GR' : code); } catch { return code; } };
const num = v => typeof v === 'number' && Number.isFinite(v);
// Round before reading the sign, so -0.004 shows as €0.00, not −€0.00.
const money = (v, cur) => { if (!num(v)) return T[lang].none; const r = Math.round(v * 100) / 100; return `${r < 0 ? '−' : ''}${cur}${Math.abs(r).toFixed(2)}`; };
const pct = v => { if (!num(v)) return ''; const r = Math.round(v * 1000) / 10; return `${r < 0 ? '−' : ''}${Math.abs(r).toFixed(1)}%`; };
const SYM = { EUR: '€', USD: '$' };

function paint() {
  const t = T[lang];
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.title = lang === 'zh' ? '到岸 Landed · 商品体检' : 'Landed · Catalogue audit';
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t[el.dataset.t]; });
  $('lang').textContent = lang === 'zh' ? 'English' : '中文';
  const cur = $('market').value || 'DE';
  $('market').innerHTML = MARKETS.map(m => `<option value="${m}">${esc(mname(m))}</option>`).join('');
  $('market').value = cur;
  if (last) render(last);
}

function render(r) {
  const t = T[lang], s = r.summary, bv = s.by_verdict;
  const other = bv.not_priced + bv.error + bv.no_price;
  $('cards').innerHTML = [
    ['', s.products, t.cards.products], ['bad', bv.loses_money, t.cards.loses_money],
    ['warn', bv.below_target, t.cards.below_target], ['ok', bv.on_target, t.cards.on_target], ['', other, t.cards.other],
  ].map(([c, n, l]) => `<div class="card ${c}"><b>${n}</b><span>${esc(l)}</span></div>`).join('');
  // One figure per currency, as a magnitude: the sentence already says "lost".
  const loss = Object.entries(s.monthly_loss_from_losing_products || {}).map(([c, v]) => money(Math.abs(v), SYM[c] || c)).join(t.and);
  $('headline').textContent = t.head(bv.loses_money, s.products, loss);
  $('rows').innerHTML = r.rows.map(row => {
    const cur = row.currency === 'USD' ? '$' : '€';
    const ctx = a => ({ ...a, m: v => money(v, cur), y: v => money(v, '¥'), mname: a.market ? mname(a.market) : '' });
    const acts = (row.actions || []).map(a => `<li>${esc(t.a[a.kind] ? t.a[a.kind](ctx(a)) : a.kind)}</li>`).join('');
    // Known codes in the page's language; anything else (engine messages) falls back to the server's English.
    const say = (dict, code, params, fallback) => {
      const fn = code && dict[code];
      if (!fn) return fallback || '';
      const p = { ...(params || {}) };
      if (p.field) p.f = t.f[p.field] || p.field;
      if (p.market) p.mname = mname(p.market);
      try { return fn(p); } catch { return fallback || ''; }
    };
    const note = row.verdict === 'error' ? say(t.e, row.error_code, row.error_params, row.error)
      : say(t.n, row.note_code, row.note_params, row.note);
    const now = row.list_price != null ? `${money(row.list_price, cur)}<br><span class="muted">${pct(row.margin)}</span>` : t.none;
    const tp = row.target_price != null ? `<br><span class="muted">${t.target} ${money(row.target_price, cur)}</span>` : '';
    return `<tr>
      <td>${esc(row.name || `#${row.line}`)}<br><span class="muted">${esc(row.market ? mname(row.market) : '')}${row.us_lower_bound ? ' · ' + esc(t.lb) : ''}</span></td>
      <td><span class="pill v-${esc(row.verdict)}">${esc(t.v[row.verdict] || row.verdict)}</span></td>
      <td class="num">${now}${tp}</td>
      <td class="num">${money(row.profit_per_unit, cur)}</td>
      <td>${acts ? `<ul class="acts">${acts}</ul>` : ''}${note ? `<span class="muted">${esc(note)}</span>` : ''}</td>
    </tr>`;
  }).join('');
  $('cols').textContent = t.cols + Object.values(s.columns_used).join(', ') + (s.columns_ignored.length ? ` · ${t.ignored}${s.columns_ignored.join(', ')}` : '');
  $('out').hidden = false;
}

async function run() {
  $('err').textContent = '';
  $('run').disabled = true; $('run').textContent = T[lang].working;
  try {
    let res;
    try {
      res = await fetch('/api/audit', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ csv: $('csv').value, profile: { market: $('market').value, target_margin: Number($('margin').value) / 100 } }) });
    } catch { throw new Error(T[lang].net); }
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      const d = body?.detail;
      const msg = d?.error || (typeof d === 'string' ? d : Array.isArray(d) ? d.map(e => e.msg).join('; ') : '');
      throw new Error(msg || T[lang].http(res.status));
    }
    last = body; render(body);
  } catch (e) { $('err').textContent = e.message; }
  finally { $('run').disabled = false; $('run').textContent = T[lang].run; }
}

$('lang').onclick = () => { lang = lang === 'zh' ? 'en' : 'zh'; try { localStorage.setItem('landed-lang', lang); } catch { /* ignore */ } paint(); };
$('sample').onclick = () => { $('csv').value = SAMPLE; };
$('upload').onclick = () => $('file').click();
$('file').onchange = async e => { const f = e.target.files[0]; if (f) $('csv').value = await f.text(); };
$('run').onclick = run;
$('csv').value = SAMPLE;
paint();
</script>
</body>
</html>
